[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open-model-backdoor-lab"
version = "0.1.0"
description = "Offline evaluation harness for open-weight model backdoor research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
backdoor-lab = "backdoor_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["backdoor_lab*"]
